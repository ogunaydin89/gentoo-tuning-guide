# /etc/portage/make.conf for AMD Ryzen 7 5800X3D + AMD Radeon RX 9070 XT
COMMON_FLAGS="-O2 -march=native -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# Mold Linker for instantaneous package linking
LDFLAGS="${COMMON_FLAGS} -Wl,-O1 -Wl,--as-needed -fuse-ld=mold"
RUSTFLAGS="-C target-cpu=native -C link-arg=-fuse-ld=mold"

# Multicore optimization (Full 8 cores / 16 threads utilized)
MAKEOPTS="-j16 -l14"
NINJAOPTS="-j16"
EMERGE_DEFAULT_OPTS="--jobs=16 --load-average=14 --getbinpkg=y --binpkg-respect-use=y --usepkg-exclude=\"sys-kernel/gentoo-kernel virtual/dist-kernel app-admin/ryzen_smu\""

# Upstream binhost / package settings
ACCEPT_LICENSE="*"

# Target architecture & hardware
GRUB_PLATFORMS="efi-64"
VIDEO_CARDS="amdgpu radeonsi"
CPU_FLAGS_X86="aes avx avx2 bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"

# Global USE flags (Debloated: No Bluetooth, Printing, or Cellular Modems)
USE="wayland pipewire pipewire-alsa elogind dbus udev policykit lz4 zstd pulseaudio alsa vulkan opengl vdpau vaapi hwaccel screencast networkmanager sddm plasma dav1d svt-av1 jpegxl avif heif opus x264 x265 -systemd -telemetry -bluetooth -cups -modemmanager -handbook -doc -test"

# Features: prebuilt binaries, ccache, parallel operations
FEATURES="ccache parallel-fetch parallel-install"
CCACHE_DIR="/var/cache/ccache"
LC_MESSAGES=C.utf8

# Compression for packages
BINPKG_COMPRESS="lz4"
BINPKG_COMPRESS_FLAGS="-T16"
PORTAGE_COMPRESS="lz4"
PORTAGE_COMPRESS_FLAGS="-T16"
ACCEPT_KEYWORDS="~amd64"
